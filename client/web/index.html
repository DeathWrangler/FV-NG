<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FV-NG — Farm</title>
<style>
  :root { --bg:#0e1a12; --panel:#16241b; --panel2:#1d3024; --ink:#e8f3ea; --mut:#8fae97; --accent:#7ed957; --gold:#ffcf4d; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden; }
  /* Fixed game stage matching the original Flash embed (1018x600) so zoom / scroll / horizon
     behaviour matches the original client. */
  #game { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:1018px; height:600px; overflow:hidden; background:#206fb1;
    box-shadow:0 0 0 1px #2c4636, 0 12px 48px rgba(0,0,0,.6); }
  #stage { position:absolute; inset:0; display:block; width:100%; height:100%; cursor:grab; }
  #stage.dragging { cursor:grabbing; }
  /* HUD overlay (original Farmville chrome). pointer-events:none so farm input still reaches #stage;
     hud.js hit-tests HUD widgets from the stage events (same coordinate space). */
  #hud { position:absolute; inset:0; display:block; width:100%; height:100%; pointer-events:none; }
  #hud-dom { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  #boot { position:absolute; inset:0; z-index:20; display:flex; flex-direction:column; gap:8px;
    align-items:center; justify-content:center; background:radial-gradient(120% 120% at 50% 0%,#16301f,#0b140e); }
  #boot .logo { font-size:34px; font-weight:900; letter-spacing:.04em; }
  #boot .logo span { color:var(--accent); }
  #bootlog { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; color:var(--mut);
    width:min(560px,86vw); height:180px; overflow:auto; background:#0a120c; border:1px solid #24382b;
    border-radius:10px; padding:10px 12px; white-space:pre-wrap; }
  .ok{color:var(--accent)} .err{color:#ff9a9a} .dim{color:var(--mut)}
  /* Shared inventory/market panel (functional; original SWFs available via ?dialog=) */
  .mk-panel { position:absolute; z-index:15; left:50%; top:50%; transform:translate(-50%,-50%);
    width:960px; height:560px; background:linear-gradient(180deg,#8a6a38,#5f4522); padding:14px;
    border:3px solid #caa24a; border-radius:12px; box-shadow:0 12px 40px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,235,180,.25);
    display:flex; flex-direction:column; color:#fff3d6; font:14px/1.3 system-ui,sans-serif; }
  .mk-panel[hidden] { display:none; }
  #storage { width:784px; height:620px; padding:6px; }
  #market { width:1136px; height:690px; padding:6px; }
  .mk-bg { position:absolute; left:0; top:0; width:100%; height:100%; z-index:0; border-radius:10px; }
  .mk-canvas { position:absolute; left:0; top:0; width:100%; height:100%; z-index:0; border-radius:10px; }
  .mk-panel > .mk-head, .mk-panel > .mk-tabs { position:relative; z-index:1; }
  .mk-head { display:flex; gap:8px; align-items:center; padding:8px 10px; background:linear-gradient(180deg,#9a7940,#7a5a2a);
    border-bottom:2px solid #caa24a; border-radius:9px 9px 0 0; }
  .mk-head b { font-size:16px; color:#fff0c0; text-shadow:0 1px 0 #4a3512; }
  .mk-panel input, .mk-panel select, .mk-panel button { font:inherit; border-radius:6px; border:1px solid #caa24a; padding:4px 8px; }
  .mk-panel input { flex:1; background:#3a2a12; color:#fff3d6; }
  .mk-panel input::placeholder { color:#d8c090; }
  .mk-count { color:#f0dca8; font-size:12px; }
  .mk-close { cursor:pointer; background:#8a2b2b; color:#fff; border-color:#e0a0a0; }
  .mk-tabs { display:flex; gap:4px; padding:7px 8px 0; overflow-x:auto; background:linear-gradient(180deg,#7a5a2a,#6b4e24); border-bottom:2px solid rgba(217,178,94,.6); }
  .mk-tab { cursor:pointer; width:60px; height:52px; background-size:100% 100%; background-repeat:no-repeat;
    border:none; border-radius:6px 6px 0 0; padding:0; filter:saturate(.9); }
  .mk-tab:hover { filter:saturate(1.1) brightness(1.05); }
  .mk-tab.active { filter:none; box-shadow:0 0 0 2px #ffe066 inset; }
  .mk-list { flex:1; overflow:auto; padding:8px; display:grid; grid-template-columns:repeat(4,1fr); gap:8px; align-content:start; background:#e9dcb8; border-radius:0 0 8px 8px; }
  .mk-card { display:flex; flex-direction:column; align-items:center; gap:3px; position:relative;
    background:linear-gradient(180deg,#f7ecd0,#e6d3a6); border:2px solid #b98f3e; border-radius:10px; padding:7px; color:#4a3512; }
  .mk-art { width:64px; height:64px; }
  .mk-name { font-weight:600; font-size:13px; text-align:center; line-height:1.15; }
  .mk-type { font-size:10px; color:#8a6a30; text-transform:uppercase; letter-spacing:.04em; }
  .mk-meta { display:flex; gap:6px; font-size:11px; }
  .mk-grow { color:#2a6e2a; }
  .mk-lvl { background:#e2c268; color:#4a3512; border-radius:4px; padding:0 5px; font-weight:600; }
  .mk-cash { color:#1d7a3a; font-weight:600; }
  .mk-qty { position:absolute; right:8px; top:6px; background:#5a3a12; color:#ffe9a8; border-radius:6px; padding:1px 6px; font-weight:700; font-size:12px; }
  .mk-foot { display:flex; align-items:center; gap:6px; margin-top:2px; }
  .mk-foot .cost { color:#7a5a18; font-weight:600; }
  .mk-card button { cursor:pointer; background:linear-gradient(180deg,#e8c256,#a9842a); color:#2a1e06; border:1px solid #8a6a26; border-radius:6px; padding:3px 10px; font-weight:700; }
  .mk-card button:hover { background:linear-gradient(180deg,#f2d272,#c39a34); }
  .mk-empty { grid-column:1/-1; color:#f0dca8; padding:20px; text-align:center; }
  #toast { position:absolute; z-index:30; left:50%; bottom:16px; transform:translateX(-50%);
    background:rgba(20,30,18,.92); color:#eaf7e0; border:1px solid #4f7a3a; border-radius:8px;
    padding:8px 14px; font:13px/1.3 system-ui,sans-serif; box-shadow:0 6px 20px rgba(0,0,0,.5); }
  #toast[hidden] { display:none; }
</style>
</head>
<body>
<div id="game">
<canvas id="stage"></canvas>
<canvas id="hud"></canvas>
<div id="hud-dom"></div>

<div id="market" class="mk-panel" hidden>
  <canvas id="mkt-canvas" class="mk-canvas"></canvas>
</div>
<div id="storage" class="mk-panel" hidden>
  <canvas id="st-canvas" class="mk-canvas"></canvas>
</div>
<div id="toast" hidden></div>

<div id="boot">
  <div class="logo">FV<span>-NG</span></div>
  <div id="bootlog"></div>
</div>
<p>Written by DeathWrangler</p>
</div>

<script src="amf3.browser.js"></script>
<script src="scene2d.js?v=32"></script>
<script src="fvstage.js?v=32"></script>
<script src="zw.js?v=32"></script>
<script src="hud.js?v=32"></script>
<script src="ui.js?v=32"></script>
<script src="market.js?v=32"></script>
<script src="marketwindow.js?v=32"></script>
<script src="app.js?v=32"></script>
</body>
</html>
