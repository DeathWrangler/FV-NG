<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>FV-NG UI test</title>
<style>html,body{margin:0;height:100%;background:#0e1a12}canvas{display:block}</style></head>
<body>
<canvas id="c"></canvas>
<script src="scene2d.js"></script>
<script src="ui.js"></script>
<script>
(function(){
  const c=document.getElementById('c'),ctx=c.getContext('2d');
  function resize(){const d=Math.min(devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0);}
  resize(); addEventListener('resize',resize);
  const dlg=new FVDialog(c,ctx);
  const name=new URLSearchParams(location.search).get('dialog')||'FV_motd_idealvacation';
  dlg.open('scenes/dlg_'+name+'.scene.json',{name:name}).then(function(){
    (function loop(){ ctx.clearRect(0,0,innerWidth,innerHeight); dlg.render(performance.now()); requestAnimationFrame(loop); })();
  }).catch(function(e){ document.body.insertAdjacentHTML('beforeend','<pre style="color:#f88;position:absolute;top:10px;left:10px">ERR '+e.message+'</pre>'); });
})();
</script>
</body></html>
